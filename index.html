:root{color-scheme:dark;--bg:#14090f;--card:#241019;--ink:#fbeaf0;--mute:#c9a3b2;--acc:#ff6b95}
*{box-sizing:border-box}

.card.out{transform:translate(140%,-30px) rotate(24deg)!important;opacity:0}
#ctl{display:flex;gap:1rem;align-items:center;justify-content:center;padding:.4rem}
#cnt{color:var(--mute);min-width:5ch;text-align:center}

const $=id=>document.getElementById(id);
const ROT=[0,-6,5,-11],TX=[0,-20,18,-30],TY=[0,-10,-16,-24];
let cur=0,idx=0,busy=false,playing=true,timer=null,px=null;
const fmt=d=>{const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})};
const P=()=>ALBUMS[cur].photos;
function chips(){
  $('chips').innerHTML='';
  if(ALBUMS.length<2)return;
  ALBUMS.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a.name;if(i===cur)b.className='on';b.onclick=()=>{cur=i;idx=0;chips();draw()};$('chips').append(b)});
}
function draw(){
  const a=ALBUMS[cur],st=$('stack');st.innerHTML='';
  $('meta').textContent=a.name+' · '+fmt(a.date);
  $('cnt').textContent=(idx+1)+' / '+P().length;
  const n=Math.min(4,P().length);
  for(let k=n-1;k>=0;k--){
    const c=document.createElement('div');c.className='card';
    const im=document.createElement('img');im.src=P()[(idx+k)%P().length];im.alt='';c.append(im);
    c.style.transform='translate('+TX[k]+'px,'+TY[k]+'px) rotate('+ROT[k]+'deg)';
    c.style.zIndex=10-k;if(k>0)c.style.filter='brightness(.8)';
    st.append(c);
  }
}
function go(d){
  const f=$('stack').lastChild;if(!f||busy||P().length<2)return;busy=true;
  if(d>0)f.classList.add('out');
  setTimeout(()=>{idx=(idx+d+P().length)%P().length;draw();busy=false},d>0?420:0);
}
function restart(){clearInterval(timer);if(playing)timer=setInterval(()=>go(1),4000)}
$('next').onclick=()=>{go(1);restart()};
$('prev').onclick=()=>{go(-1);restart()};
$('pp').onclick=()=>{playing=!playing;$('pp').textContent=playing?'⏸ Pause':'▶ Play';restart()};
$('stack').addEventListener('pointerdown',e=>{px=e.clientX});
$('stack').addEventListener('pointerup',e=>{if(px===null)return;const dx=e.clientX-px;px=null;go(dx>40?-1:1);restart()});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
chips();draw();restart();
</script>
